# The compliance.tf release catalog embedded in ctfkit: the CIS AWS Benchmark
# v6.0 controls, with their CIS v6.0 clauses only. Generated from the control
# catalog; edit that, not this. The full catalog is delivered separately and
# read with --catalog FILE or from ~/.ctf/control-requirements.yaml.
#
# Framework ids are the ids a served manifest carries (soc_2, pci_dss_v40).
# hosts maps each to the host label of its registry endpoint, which is what
# {host} in a module source is replaced with.
